[project]
name = "chano"
version = "1.0.0a2"
description = "A serverless-first Python web framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.30",
]

[project.scripts]
chano = "chano.cli:main"

[dependency-groups]
dev = [
    "chano[dev]",
    "httpx>=0.27",
    "pydantic>=2.14.4",
    "pytest>=8",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "vercel-queue>=0.11.0",
    "vercel-runtime",
    "vercel-workflow>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
exclude = ["site"]

[tool.uv]
exclude-newer = "2 days"
# Rebuild when sources change, so apps depending on a local checkout by path
# (like examples/hello) don't vendor a stale cached wheel.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
